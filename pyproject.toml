[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docs-to-markdown"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "markdown-it-py>=4,<5",
    "markitdown[docx,pdf]==0.1.7",
    "mdit-py-plugins>=0.4,<1",
    "pdfplumber>=0.11.9,<1",
    "pillow>=11,<13",
    "pypdfium2>=5.10,<6",
    "python-docx>=1.2,<2",
    "python-multipart>=0.0.20,<1",
    "rapidocr-onnxruntime>=1.4,<2",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
]
site = [
    "mkdocs>=1.6,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/docs_to_markdown"]

[tool.pytest.ini_options]
testpaths = ["tests"]
