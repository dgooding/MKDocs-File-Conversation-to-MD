<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Documents to Markdown</title>
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <main>
      <header class="page-header">
        <h1>Documents to Markdown</h1>
        <a href="/batch">Batch conversion</a>
        <a id="search-site-link" href="http://127.0.0.1:8001/" target="_blank" rel="noopener">Open search site</a>
      </header>

      <section class="quick-start" aria-label="How to use this page">
        <h2>How to use</h2>
        <ol>
          <li>Select a DOCX or PDF file.</li>
          <li>Select Convert and wait for "Conversion complete."</li>
          <li>Review or edit the Markdown text.</li>
          <li>Select Download Markdown to save the file.</li>
        </ol>
      </section>

      <form id="conversion-form">
        <label for="document">DOCX or PDF file</label>
        <input id="document" name="file" type="file" accept=".docx,.pdf" required>
        <p id="selected-file" class="hint">No file selected.</p>
        <button type="submit">Convert</button>
      </form>

      <p id="status" class="status-info" role="status" aria-live="polite">Ready.</p>

      <div class="workspace">
        <section>
          <h2><label for="markdown">Markdown</label></h2>
          <textarea id="markdown" rows="24"></textarea>
        </section>
        <section>
          <h2>Preview</h2>
          <div id="preview" class="preview" aria-live="polite"></div>
        </section>
      </div>
      <button id="download" type="button" disabled>Download Markdown</button>
      <button id="publish" type="button" disabled>Publish to search site</button>
    </main>
  </body>
</html>
