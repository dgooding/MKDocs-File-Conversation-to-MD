site_name: MkDocs File → Markdown
site_description: Drag-and-drop document conversion to Markdown for MkDocs — high-fidelity PDF with images, bold, and color
site_url: https://dgooding.github.io/MKDocs-File-Conversation-to-MD/
repo_url: https://github.com/dgooding/MKDocs-File-Conversation-to-MD
repo_name: dgooding/MKDocs-File-Conversation-to-MD
edit_uri: edit/main/docs/
copyright: Convert docs to Markdown for MkDocs

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 100%
      height: auto

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/converter-link.js

nav:
  - Home: index.md
  - Convert files: convert.md
  - How it works: how-it-works.md
  - Deploy live site: deploy-public.md
  - Converted docs:
      - Overview: converted/index.md
      - Demo handbook (sample PDF): converted/demo-handbook/demo-handbook.md

docs_dir: docs
site_dir: site
