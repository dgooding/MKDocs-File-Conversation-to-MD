# Free-tier friendly Render blueprint
# https://render.com — connect this repo and apply the blueprint
services:
  - type: web
    name: mkdocs-file-to-md
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: converted-data
      mountPath: /app/docs/converted
      sizeGB: 1
