apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs-to-markdown
  labels:
    app.kubernetes.io/name: docs-to-markdown
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: docs-to-markdown
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docs-to-markdown
    spec:
      containers:
        - name: app
          image: docs-to-markdown:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: docs-to-markdown
  labels:
    app.kubernetes.io/name: docs-to-markdown
spec:
  selector:
    app.kubernetes.io/name: docs-to-markdown
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: docs-to-markdown
  labels:
    app.kubernetes.io/name: docs-to-markdown
spec:
  to:
    kind: Service
    name: docs-to-markdown
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect