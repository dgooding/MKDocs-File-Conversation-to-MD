# Fallback if Dockerfile is not used
[phases.setup]
nixPkgs = ["tesseract", "poppler_utils", "ffmpeg"]

[phases.install]
cmds = ["pip install -r requirements.txt", "pip install Pillow || true"]

[phases.build]
cmds = ["python -m mkdocs build --clean"]

[start]
cmd = "python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
